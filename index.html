const imgs=[VIEWS.land.BG,VIEWS.land.FG,VIEWS.port.BG,VIEWS.port.FG,...Object.values(VIEWS.land.LBL),...Object.values(VIEWS.port.LBL)];
let ready=0; const go=()=>{ if(++ready<imgs.length) return; applyState(normalizeState(DEFAULT_STATE)); fit(); window.READY=true; STARTED_AT=performance.now();
  pullState(); setInterval(pullState,60000);
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) pullState(); }); addEventListener("online",pullState);
  if(!window.NO_LOOP){ const off=parseFloat((location.hash.match(/t=([\d.]+)/)||[])[1]||0); const t0=performance.now(); const loop=()=>{renderAt((performance.now()-t0)/1000+off); requestAnimationFrame(loop)}; loop(); } };
imgs.forEach(i=>{ if(i.complete&&i.naturalWidth) go(); else i.onload=go; });

if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) { const had=!!navigator.serviceWorker.controller; let re=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(had&&!re){ re=true; location.reload(); } });
  addEventListener("load",()=>navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{})); }
